{% assign current_url = page.url | remove: 'index.html' %}
<header class="navigation-wrapper">
  <div class="site-name">
    <a href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <span class="site-mark" aria-hidden="true">LD</span>
      <span class="site-identity">
        <strong>{{ site.title }}</strong>
        <small>{{ site.tagline }}</small>
      </span>
    </a>
  </div>
  <div class="top-navigation">
    <nav aria-label="Primary navigation">
      <ul>
        {% for link in site.links %}
          {% if link.external %}
            <li><a href="{{ link.url }}" target="_blank" rel="noreferrer">{{ link.title }}</a></li>
          {% else %}
            <li><a href="{{ link.url | relative_url }}"{% if current_url == link.url %} class="top-navigation-current" aria-current="page"{% endif %}>{{ link.title }}</a></li>
          {% endif %}
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
