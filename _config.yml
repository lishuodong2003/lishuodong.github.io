# Site identity
title: Lishuo Dong
tagline: Computational Mathematics
description: Personal academic homepage of Lishuo Dong, a graduate student in computational mathematics.
lang: en

# This repository is currently a project site under lishuodong2003.github.io.
# If it is renamed to lishuodong2003.github.io, set baseurl to "".
url: https://lishuodong2003.github.io
baseurl: /lishuodong.github.io
repository: lishuodong2003/lishuodong.github.io

owner:
  name: Lishuo Dong
  name_zh: 董立硕
  avatar: /assets/images/profile.png
  bio: Graduate student in Computational Mathematics
  bio_zh: 计算数学硕士研究生
  affiliation: Nanjing University of Science and Technology
  affiliation_zh: 南京理工大学
  email: 1745216598@qq.com
  github: lishuodong2003

links:
  - title: Home
    url: /
  - title: Research
    url: /research/
  - title: Honors
    url: /honors/
  - title: 中文
    url: /cn/

timezone: Asia/Shanghai
future: true
highlighter: rouge
permalink: /:categories/:title/

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false

plugins:
  - jekyll-feed
  - jekyll-sitemap

# The upstream template ships with its author's articles and media. They remain
# in the repository for reference but are deliberately omitted from the site.
exclude:
  - backup
  - blogs
  - blogs.md
  - hobbies.md
  - services.md
  - mypaper
  - images
  - caihanlin.jpg
  - cam_logo.png
  - CNAME
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - lib
  - config.rb
  - Capfile
  - config
  - log
  - Rakefile
  - Rakefile.rb
  - tmp
  - less
  - minimal-mistakes.sublime-project
  - minimal-mistakes.sublime-workspace
